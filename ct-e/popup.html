<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<div class="header">
<h1>Toxicity Detector</h1>
<p class="tagline">AI toxicity detection</p>
</div>

<div class="toggle-section">

<span>Protection</span>

<label class="switch">
<input type="checkbox" id="toggle">
<span class="slider"></span>
</label>

</div>

<div class="test-box">

<textarea id="commentInput" placeholder="Test a comment..."></textarea>

<button id="checkBtn">Analyze Comment</button>

<div id="result"></div>

</div>

<div class="footer">
Running locally • DistilBERT
</div>

</div>

<script src="popup.js"></script>

</body>

</html>
